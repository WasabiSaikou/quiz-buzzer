<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Buzzer — Teacher</title>
  <style>
    :root { --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --bg:#fff; --soft:#f6f8fa;
            --err:#b42318; --errbg:#fef3f2; --warn:#8a5a00; --warnbg:#fffaeb; --ok:#1a7f37; --accent:#0969da; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, "Microsoft JhengHei", sans-serif; color: var(--fg); background: var(--soft); }
    header { background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 24px; }
    header h1 { margin: 0; font-size: 18px; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; }
    section { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
    h2 { margin: 0 0 12px; font-size: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
    .row > .grow { flex: 1 1 320px; }
    input[type=url], input[type=number], select { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    input[type=number] { width: 6em; }
    button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); font: inherit; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    .banner { padding: 10px 14px; border-radius: 6px; margin: 0 0 12px; white-space: pre-wrap; }
    .banner.error { background: var(--errbg); color: var(--err); border: 1px solid #fecdca; }
    .banner.info { background: var(--soft); border: 1px solid var(--line); }
    .banner code { user-select: all; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 13px; color: var(--muted); font-weight: 600; }
    .tag { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; background: var(--soft); border: 1px solid var(--line); }
    .tag.group { background: #ddf4ff; border-color: #b6e3ff; }
    .totals { display: flex; gap: 20px; margin: 0 0 12px; }
    .totals b { font-size: 18px; }
    ul.issues { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
    ul.issues li { padding: 8px 12px; border-radius: 6px; }
    ul.issues li.error { background: var(--errbg); color: var(--err); }
    ul.issues li.warning { background: var(--warnbg); color: var(--warn); }
    ul.issues .where { font-size: 12px; opacity: .85; }
    form.confirm { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    label.check { display: flex; gap: 6px; align-items: center; font-weight: 400; margin: 0 0 6px; }
    .current-head { display: flex; gap: 10px; align-items: center; margin: 0 0 4px; }
    .tag.DRAFT { background: #fff8c5; border-color: #eac54f; }
    .tag.OPEN { background: #dafbe1; border-color: #4ac26b; }
    .tag.CLOSED { background: #eaeef2; border-color: #afb8c1; }
    .tag.winner { background: #fff8c5; border-color: #d4a72c; font-weight: 600; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; }
    button.danger { border-color: #cf222e; color: #cf222e; background: #fff; }
    .dash-unit { margin: 0 0 16px; }
    .dash-unit h3 { margin: 0 0 6px; font-size: 15px; }
    .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 0 0 16px; }
    .answer { white-space: pre-wrap; }
    ul.problems { margin: 6px 0 0; padding-left: 18px; }
    .groups div { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
  </style>
</head>
<body>
  <header><h1>Quiz Buzzer（課堂搶答系統）· Teacher</h1></header>
  <main>
    <section id="lock-section" class="hidden">
      <h2>Teacher passcode</h2>
      <div id="lock-message" class="banner hidden" role="alert"></div>
      <form id="lock-form" class="row">
        <div class="grow">
          <label for="passcode">Passcode</label>
          <input id="passcode" type="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="primary">Unlock</button>
      </form>
    </section>

    <section id="import-section">
      <h2 id="import-heading">Import a Guided Notes worksheet</h2>
      <p id="reimport-note" class="muted hidden"></p>
      <div id="import-message" class="banner hidden" role="alert"></div>
      <form id="url-form" class="row">
        <div class="grow">
          <label for="sheet-url">Google Sheets link</label>
          <input id="sheet-url" type="url" required placeholder="https://docs.google.com/spreadsheets/d/…">
        </div>
        <button type="submit" class="primary">Load tabs</button>
        <button type="button" id="cancel-reimport" class="hidden">Cancel re-import</button>
      </form>
      <div id="tab-row" class="row hidden" style="margin-top:12px">
        <div class="grow">
          <label for="tab-select">Tab</label>
          <select id="tab-select"></select>
        </div>
        <button type="button" id="refresh-preview">Refresh preview</button>
      </div>
    </section>

    <section id="preview-section" class="hidden" aria-live="polite">
      <h2 id="preview-title">Preview</h2>
      <div class="totals">
        <span><b id="total-units">0</b> questions</span>
        <span><b id="total-slots">0</b> answer slots</span>
        <span><b id="total-errors">0</b> errors</span>
        <span><b id="total-warnings">0</b> warnings</span>
      </div>
      <ul id="issues" class="issues"></ul>
      <table>
        <thead><tr><th>題號</th><th>Type</th><th>Sub-parts</th><th>Answer cells</th></tr></thead>
        <tbody id="units"></tbody>
      </table>

      <form id="confirm-form" class="confirm">
        <div id="confirm-message" class="banner hidden" role="alert"></div>
        <div class="row">
          <div id="group-count-field">
            <label for="group-count">Groups (2–12)</label>
            <input id="group-count" type="number" min="2" max="12" step="1" value="4" required>
          </div>
          <label id="ack-row" class="check hidden">
            <input id="ack-warnings" type="checkbox"> I have read the warnings above
          </label>
          <button type="submit" id="confirm-button" class="primary" disabled>Create DRAFT activity</button>
        </div>
        <p id="confirm-hint" class="muted"></p>
      </form>
    </section>

    <section id="current-section" class="hidden" aria-live="polite">
      <h2>Current activity</h2>
      <div id="current-message" class="banner hidden" role="alert"></div>
      <p class="current-head">
        <strong id="current-title"></strong>
        <span id="current-phase" class="tag"></span>
      </p>
      <p class="muted" id="current-meta"></p>
      <div class="actions">
        <button type="button" id="open-button" class="primary hidden">Open activity</button>
        <button type="button" id="reimport-button" class="hidden">Re-import questions…</button>
        <button type="button" id="cancel-button" class="danger hidden">Cancel activity</button>
        <button type="button" id="end-button" class="danger hidden">End activity</button>
        <button type="button" id="new-import-button" class="primary hidden">Import a new worksheet</button>
      </div>
      <table>
        <thead><tr><th>題號</th><th>Type</th><th>Sub-parts</th><th>Answer cells</th></tr></thead>
        <tbody id="current-units"></tbody>
      </table>
    </section>

    <section id="dashboard-section" class="hidden" aria-live="polite">
      <h2 id="dashboard-title">Live dashboard</h2>
      <h3 class="muted" style="font-size:14px;margin:0 0 6px">Groups</h3>
      <div id="dashboard-groups" class="groups"></div>
      <div id="dashboard-units"></div>
    </section>

    <section id="results-section" class="hidden" aria-live="polite">
      <h2 id="results-title">Results</h2>
      <div id="results-message" class="banner hidden" role="alert"></div>
      <div class="actions">
        <button type="button" id="export-button" class="primary">Export to sheet</button>
      </div>
      <div id="export-report" class="banner hidden" role="status"></div>
      <div id="results-units"></div>
    </section>

    <p id="live-status" class="muted">Connecting…</p>
  </main>
  <script type="module" src="/static/teacher.js"></script>
</body>
</html>
